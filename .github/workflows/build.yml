name: Build nMedia

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish release assets for
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Fetch Ndless dependency
        id: ndless-source
        run: |
          if [ ! -d external/Ndless-official/.git ]; then
            rm -rf external/Ndless-official
            git clone --branch master --recurse-submodules https://github.com/ndless-nspire/Ndless.git external/Ndless-official
          fi
          git -C external/Ndless-official fetch --tags origin master
          git -C external/Ndless-official checkout master
          git -C external/Ndless-official reset --hard origin/master
          git -C external/Ndless-official submodule sync --recursive
          git -C external/Ndless-official submodule update --init --recursive
          echo "sha=$(git -C external/Ndless-official rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            ffmpeg \
            libboost-program-options-dev \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libtinfo-dev \
            python3-dev \
            texinfo \
            xz-utils \
            zlib1g-dev

      - name: Check USB transport and filesystems
        run: python3 tools/check_usb_storage.py

      - name: Check USB driver lifecycle
        run: python3 tools/check_usb_lifecycle.py

      - name: Check USB native handoff and timer recovery
        run: |
          python3 tools/check_usb_runtime.py
          python3 tools/check_timer_settle.py

      - name: Check quiet defaults and original-CX RAM fallback
        run: |
          python3 tools/check_release_defaults.py
          python3 tools/check_release_features.py

      - name: Check NAND DMA ownership and recovery
        run: python3 tools/check_nand_dma.py

      - name: Check MPEG-4 shared lookahead and output
        run: python3 tools/check_mpeg4_lookahead.py

      - name: Check CX SRAM layout guards and diagnostics
        run: python3 tools/check_sram_layout.py

      - name: Check read-only CX SRAM survey
        run: python3 tools/check_sram_survey.py

      - name: Check prefetch scheduling and overloaded USB reads
        run: python3 tools/check_prefetch_schedule.py

      - name: Cache Ndless ARM toolchain
        uses: actions/cache@v5
        id: ndless-toolchain-cache
        with:
          path: external/Ndless-official/ndless-sdk/toolchain/install
          key: ${{ runner.os }}-ndless-toolchain-${{ steps.ndless-source.outputs.sha }}-${{ hashFiles('external/Ndless-official/ndless-sdk/toolchain/build_toolchain.sh') }}

      - name: Build Ndless ARM toolchain
        if: steps.ndless-toolchain-cache.outputs.cache-hit != 'true'
        working-directory: external/Ndless-official/ndless-sdk/toolchain
        run: PARALLEL="-j$(nproc)" ./build_toolchain.sh

      - name: Add Ndless toolchain to PATH
        run: |
          echo "$GITHUB_WORKSPACE/external/Ndless-official/ndless-sdk/toolchain/install/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/external/Ndless-official/ndless-sdk/bin" >> "$GITHUB_PATH"

      - name: Build Ndless SDK libraries
        working-directory: external/Ndless-official/ndless-sdk
        run: |
          make build-libsyscalls
          make build-libndls
          make build-thirdparty

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyelftools cryptography imageio-ffmpeg Pillow numpy

      - name: Check large files and encrypted format compatibility
        run: python tools/check_large_files.py

      - name: Check synchronized media containers and audio decoders
        run: |
          python tools/check_media.py
          python tools/check_audio_tracks.py
          python tools/check_nvp_tracks.py

      - name: Build Full and Video Lite
        run: make -j2 release SDKROOT=./external/Ndless-official/ndless-sdk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nMedia-${{ github.sha }}
          path: release/*
          if-no-files-found: error

      - name: Resolve release target
        id: release-target
        shell: bash
        run: |
          set -euo pipefail
          publish=false
          tag=""
          rolling=false
          default_branch="${{ github.event.repository.default_branch }}"
          manual_tag="${{ inputs.release_tag }}"

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            publish=true
            tag="${{ github.event.release.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            publish=true
            tag="${GITHUB_REF_NAME}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$manual_tag" ]]; then
            publish=true
            tag="$manual_tag"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/${default_branch}" ]]; then
            publish=true
            tag="latest"
            rolling=true
          fi

          {
            echo "publish=${publish}"
            echo "tag=${tag}"
            echo "rolling=${rolling}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        if: steps.release-target.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
          RELEASE_ROLLING: ${{ steps.release-target.outputs.rolling }}
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          {
            echo "nMedia Player ${RELEASE_TAG}"
            echo
            echo "Built from commit ${build_sha}."
            if [ "$RELEASE_ROLLING" = "true" ]; then
              echo
              echo "This is the rolling latest build from the default branch."
            fi
            echo
            cat build/release-notes.md
          } > build/publish-notes.md

      - name: Publish GitHub release
        if: steps.release-target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
          RELEASE_ROLLING: ${{ steps.release-target.outputs.rolling }}
        run: |
          set -euo pipefail
          build_sha="$(git rev-parse HEAD)"
          mapfile -t assets < <(find release -maxdepth 1 -type f | sort)
          if [ "$RELEASE_ROLLING" = "true" ]; then
            git tag -f "$RELEASE_TAG" "$build_sha"
            git push origin "refs/tags/$RELEASE_TAG" --force
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --yes
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "nMedia Player ${RELEASE_TAG}" \
              --notes-file build/publish-notes.md \
              --latest \
              --target "$build_sha"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "nMedia Player ${RELEASE_TAG}" \
              --notes-file build/publish-notes.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "nMedia Player ${RELEASE_TAG}" \
              --notes-file build/publish-notes.md
          fi

  encoder-windows:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-encoder*.txt

      - name: Install encoder build dependencies
        run: python -m pip install -r requirements-encoder-build.txt

      - name: Check GUI and native encoding
        run: |
          python tools/check_encoder_gui.py --screenshots build/encoder-check/screenshots
          if ($LASTEXITCODE -ne 0) { throw 'Encoder GUI checks failed' }

      - name: Build portable encoder executable
        run: python tools/build_encoder_gui.py

      - name: Test the packaged executable
        run: python tools/check_encoder_exe.py --exe dist/encoder/nMedia-Encoder-Windows-x64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: nMedia-Encoder-Windows-${{ github.sha }}
          path: dist/encoder/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nMedia-Encoder-checks-${{ github.sha }}
          path: |
            build/encoder-check/screenshots/*
            build/encoder-exe-check/*
          if-no-files-found: ignore

      - name: Attach encoder to release
        if: >-
          github.event_name == 'release' ||
          (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          $tag = $env:REQUESTED_TAG
          if (-not $tag) { $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'latest' } }
          $commit = git rev-parse HEAD
          $release = gh release view $tag --json body | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release is unavailable' }
          if (-not $release.body.Contains($commit)) {
            Write-Host 'A newer build replaced this release; its encoder assets will be kept.'
            exit 0
          }
          $assets = Get-ChildItem -LiteralPath dist/encoder -File | ForEach-Object FullName
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Encoder release upload failed' }
